services:
  db:
    image: postgres:16-alpine
    container_name: flyng_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flyng}
      POSTGRES_USER: ${POSTGRES_USER:-flyng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flyng_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flyng} -d ${POSTGRES_DB:-flyng}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flyng_redis
    volumes:
      - redis_data:/data
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: flyng_backend
    environment:
      - DEBUG=True
      - DJANGO_ENV=development
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-flyng}
      - POSTGRES_USER=${POSTGRES_USER:-flyng}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flyng_secret}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Migration control - set to true in dev for convenience
      - RUN_MIGRATIONS=true
      - COLLECT_STATIC=true
      - SYNC_DEPENDENCIES=true
      # Auto-create superuser in dev
      - CREATE_SUPERUSER=${CREATE_SUPERUSER:-true}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL:-admin@flyng.local}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD:-admin123}
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000

  # One-off migration service (use: docker-compose run --rm migrate)
  migrate:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: flyng_migrate
    environment:
      - DJANGO_ENV=development
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-flyng}
      - POSTGRES_USER=${POSTGRES_USER:-flyng}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flyng_secret}
      - RUN_MIGRATIONS=false
      - COLLECT_STATIC=false
      - SYNC_DEPENDENCIES=false
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py migrate --noinput
    profiles:
      - tools

  # Celery worker
  celery:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: flyng_celery
    environment:
      - DEBUG=True
      - DJANGO_ENV=development
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-flyng}
      - POSTGRES_USER=${POSTGRES_USER:-flyng}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flyng_secret}
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=false
      - COLLECT_STATIC=false
      - SYNC_DEPENDENCIES=false
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l INFO
    profiles:
      - workers

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    container_name: flyng_frontend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
