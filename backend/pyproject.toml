[project]
name = "flyng-backend"
version = "0.1.0"
description = "FlyNG - Warehouse Drone Management System Backend"
license = { text = "Proprietary" }
authors = [
    { name = "Neetesh NG", email = "neetesh@flyng.in" }
]
requires-python = ">=3.13"

dependencies = [
    # Django Core
    "Django>=6.0.2",
    "djangorestframework>=3.15.2",

    # Admin Interface
    "django-unfold>=0.45.0",

    # Authentication
    "djangorestframework-simplejwt>=5.4.0",
    "PyJWT>=2.10.1",

    # Two-Factor Authentication
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",

    # Database
    "psycopg2-binary>=2.9.10",

    # CORS
    "django-cors-headers>=4.6.0",

    # Filtering & Search
    "django-filter>=24.3",

    # Caching & Task Queue
    "django-redis>=5.4.0",
    "redis>=5.2.1",
    "celery>=5.4.0",

    # API Documentation
    "drf-spectacular>=0.28.0",

    # Environment Variables
    "python-dotenv>=1.0.1",

    # Utilities
    "Pillow>=11.1.0",
    "python-dateutil>=2.9.0",

    # Phone Number
    "django-phonenumber-field[phonenumberslite]>=8.0.0",

    # Timezone
    "pytz>=2024.2",

    # Model Utilities
    "django-model-utils>=5.0.0",

    # Soft Delete
    "django-safedelete>=1.4.0",

    # Audit Trail / History
    "django-simple-history>=3.7.0",

    # Field Encryption (django5 fork supports Django 5.x/6.x)
    "django-cryptography-django5>=1.2",

    # TimescaleDB (for telemetry time-series)
    "django-timescaledb>=0.2.13",

    # Model Translation (multi-language content)
    "django-modeltranslation>=0.19.0",

    # Real-time / WebSockets
    "channels>=4.2.0",
    "channels-redis>=4.2.0",
    "daphne>=4.1.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",

    # Code Quality
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",

    # Django Extensions
    "django-extensions>=3.2.3",
    "ipython>=8.24.0",

    # Debugging
    "django-debug-toolbar>=4.3.0",

    # Type Stubs
    "django-stubs>=5.0.0",
    "djangorestframework-stubs>=3.15.0",
]

prod = [
    # Production Server
    "gunicorn>=22.0.0",

    # Logging & Monitoring
    "sentry-sdk>=2.0.0",

    # Health Checks
    "django-health-check>=3.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
    "django-extensions>=3.2.3",
    "ipython>=8.24.0",
    "django-debug-toolbar>=4.3.0",
    "django-stubs>=5.0.0",
    "djangorestframework-stubs>=3.15.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "migrations",
    "__pycache__",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DJ",     # flake8-django
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405", "E402"]  # Django settings pattern

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django", "rest_framework"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["migrations", "staticfiles"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]
